<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220">
  <defs>
    <linearGradient id="gradCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gradScore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gradPhp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#777bb4"/>
      <stop offset="100%" stop-color="#8892bf"/>
    </linearGradient>
    <linearGradient id="gradJava" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="gradJs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>

  <rect width="840" height="220" rx="14" fill="url(#gradCard)" stroke="#334155" stroke-width="1.5"/>

  <!-- Coluna Esquerda: Estatísticas Gerais -->
  <g transform="translate(30, 25)">
    <text x="0" y="20" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="700" font-size="16">
      📊 Estatísticas Oficiais de Américo Ever
    </text>

    <!-- Item 1 -->
    <g transform="translate(0, 48)">
      <circle cx="10" cy="10" r="4" fill="#38bdf8"/>
      <text x="24" y="14" fill="#94a3b8" font-family="sans-serif" font-size="13">Contribuições no Ano:</text>
      <text x="190" y="14" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="13">480+ Contribuições</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 78)">
      <circle cx="10" cy="10" r="4" fill="#22c55e"/>
      <text x="24" y="14" fill="#94a3b8" font-family="sans-serif" font-size="13">Commits Recentes:</text>
      <text x="190" y="14" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="13">135+ Commits em 12 Repos</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 108)">
      <circle cx="10" cy="10" r="4" fill="#a855f7"/>
      <text x="24" y="14" fill="#94a3b8" font-family="sans-serif" font-size="13">Pull Requests &amp; Issues:</text>
      <text x="190" y="14" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="13">Ativo em Organizações</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(0, 138)">
      <circle cx="10" cy="10" r="4" fill="#ff6e40"/>
      <text x="24" y="14" fill="#94a3b8" font-family="sans-serif" font-size="13">Foco de Desenvolvimento:</text>
      <text x="190" y="14" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="13">Full Stack &amp; LMS Systems</text>
    </g>
  </g>

  <!-- Divisor Vertical -->
  <line x1="430" y1="25" x2="430" y2="195" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>

  <!-- Coluna Direita: Distribuição Real de Linguagens & Nível -->
  <g transform="translate(460, 25)">
    <text x="0" y="20" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="700" font-size="16">
      🚀 Linguagens &amp; Tecnologias Ativas
    </text>

    <!-- Barra de Progresso Combinada -->
    <g transform="translate(0, 48)">
      <!-- PHP (50%) -->
      <rect x="0" y="0" width="165" height="10" rx="5" fill="url(#gradPhp)"/>
      <!-- Java (30%) -->
      <rect x="170" y="0" width="100" height="10" rx="5" fill="url(#gradJava)"/>
      <!-- JS / Web (20%) -->
      <rect x="275" y="0" width="65" height="10" rx="5" fill="url(#gradJs)"/>
    </g>

    <!-- Legenda das Linguagens -->
    <g transform="translate(0, 75)">
      <circle cx="6" cy="6" r="4" fill="#777bb4"/>
      <text x="16" y="10" fill="#cbd5e1" font-family="sans-serif" font-size="12">PHP (Backend / MVC)</text>
      <text x="155" y="10" fill="#94a3b8" font-family="sans-serif" font-size="12">48%</text>

      <circle cx="6" cy="30" r="4" fill="#ea580c"/>
      <text x="16" y="34" fill="#cbd5e1" font-family="sans-serif" font-size="12">Java (Engenharia)</text>
      <text x="155" y="34" fill="#94a3b8" font-family="sans-serif" font-size="12">32%</text>

      <circle cx="6" cy="54" r="4" fill="#eab308"/>
      <text x="16" y="58" fill="#cbd5e1" font-family="sans-serif" font-size="12">JavaScript &amp; SQL</text>
      <text x="155" y="58" fill="#94a3b8" font-family="sans-serif" font-size="12">20%</text>
    </g>

    <!-- Badge Rank A+ -->
    <g transform="translate(250, 75)">
      <circle cx="45" cy="40" r="32" fill="none" stroke="url(#gradScore)" stroke-width="4"/>
      <text x="45" y="47" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-weight="900" font-size="22">A+</text>
      <text x="45" y="85" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">ATIVIDADE</text>
    </g>
  </g>
</svg>