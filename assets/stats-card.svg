<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gradScore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="gradBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="840" height="240" rx="16" fill="url(#gradBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Coluna 1: Perfil de Engenharia & Atividade -->
  <g transform="translate(30, 25)">
    <text x="0" y="20" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800" font-size="16">
      🤖 Engenharia de IA, Software &amp; Automação
    </text>

    <g transform="translate(0, 48)">
      <circle cx="8" cy="8" r="4.5" fill="#38bdf8"/>
      <text x="22" y="12" fill="#94a3b8" font-family="sans-serif" font-size="13">Contribuições no Ano:</text>
      <text x="180" y="12" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="13">975+ Commits &amp; Atividades</text>
    </g>

    <g transform="translate(0, 78)">
      <circle cx="8" cy="8" r="4.5" fill="#22c55e"/>
      <text x="22" y="12" fill="#94a3b8" font-family="sans-serif" font-size="13">Atuação Profissional:</text>
      <text x="180" y="12" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="13">Sistemas ERP, Automação &amp; IA</text>
    </g>

    <g transform="translate(0, 108)">
      <circle cx="8" cy="8" r="4.5" fill="#a855f7"/>
      <text x="22" y="12" fill="#94a3b8" font-family="sans-serif" font-size="13">Ecossistema Corporativo:</text>
      <text x="180" y="12" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="13">APIs, Microsserviços &amp; Docker</text>
    </g>

    <g transform="translate(0, 138)">
      <circle cx="8" cy="8" r="4.5" fill="#ff6e40"/>
      <text x="22" y="12" fill="#94a3b8" font-family="sans-serif" font-size="13">Formação &amp; Infra:</text>
      <text x="180" y="12" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="13">Engenharia Informática · Huawei</text>
    </g>
  </g>

  <!-- Divisor Vertical -->
  <line x1="435" y1="25" x2="435" y2="215" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>

  <!-- Coluna 2: Stack Multi-Linguagem & IA -->
  <g transform="translate(465, 25)">
    <text x="0" y="20" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-weight="800" font-size="16">
      ⚡ Stack Tecnológico &amp; Linguagens
    </text>

    <!-- Barra Multi-stack -->
    <rect x="0" y="45" width="345" height="10" rx="5" fill="url(#gradBar)"/>

    <!-- Grid de Especialidades -->
    <g transform="translate(0, 72)">
      <!-- Linha 1 -->
      <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
      <text x="16" y="10" fill="#cbd5e1" font-family="sans-serif" font-size="12">Python &amp; IA Generativa</text>
      <text x="155" y="10" fill="#38bdf8" font-family="sans-serif" font-weight="600" font-size="11">Automação</text>

      <circle cx="6" cy="28" r="4" fill="#22c55e"/>
      <text x="16" y="32" fill="#cbd5e1" font-family="sans-serif" font-size="12">Node.js / Express &amp; JS</text>
      <text x="155" y="32" fill="#22c55e" font-family="sans-serif" font-weight="600" font-size="11">Backend APIs</text>

      <circle cx="6" cy="50" r="4" fill="#f59e0b"/>
      <text x="16" y="54" fill="#cbd5e1" font-family="sans-serif" font-size="12">PHP &amp; Laravel</text>
      <text x="155" y="54" fill="#f59e0b" font-family="sans-serif" font-weight="600" font-size="11">Full Stack MVC</text>

      <circle cx="6" cy="72" r="4" fill="#818cf8"/>
      <text x="16" y="76" fill="#cbd5e1" font-family="sans-serif" font-size="12">Java, C++ &amp; SQL</text>
      <text x="155" y="76" fill="#818cf8" font-family="sans-serif" font-weight="600" font-size="11">Engenharia</text>
    </g>

    <!-- Badge Rank A+ -->
    <g transform="translate(255, 75)">
      <circle cx="45" cy="40" r="32" fill="none" stroke="url(#gradScore)" stroke-width="4"/>
      <text x="45" y="47" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="22">A+</text>
      <text x="45" y="85" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">PRODUÇÃO</text>
    </g>
  </g>
</svg>