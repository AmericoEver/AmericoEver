<svg width="850" height="180" viewBox="0 0 850 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 34px;
        fill: url(#text-grad);
        letter-spacing: 0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 16px;
        fill: #94a3b8;
        letter-spacing: 1px;
      }
      .badge {
        font-family: 'SF Mono', Consolas, Monaco, monospace;
        font-size: 12px;
        font-weight: 600;
        fill: #38bdf8;
      }
      .wave {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: translateY(0px); }
        100% { opacity: 0.7; transform: translateY(-3px); }
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="846" height="176" rx="16" fill="url(#bg-gradient)" stroke="url(#border-grad)" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glows -->
  <circle cx="120" cy="90" r="70" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="750" cy="90" r="90" fill="#818cf8" opacity="0.08" filter="url(#glow)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="45" x2="850" y2="45" />
    <line x1="0" y1="90" x2="850" y2="90" />
    <line x1="0" y1="135" x2="850" y2="135" />
    <line x1="170" y1="0" x2="170" y2="180" />
    <line x1="340" y1="0" x2="340" y2="180" />
    <line x1="510" y1="0" x2="510" y2="180" />
    <line x1="680" y1="0" x2="680" y2="180" />
  </g>

  <!-- Status Pill -->
  <rect x="40" y="26" width="170" height="26" rx="13" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-opacity="0.4" />
  <circle cx="54" cy="39" r="4" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="66" y="43" class="badge">FULLSTACK &amp; AI DEV</text>

  <!-- Main Name -->
  <text x="40" y="94" class="title">Américo Mabunda</text>

  <!-- Subtitle / Role -->
  <text x="40" y="126" class="subtitle">Engenheiro de IA, Arquitetura de Software &amp; Automação Cloud</text>

  <!-- Decorative Tech Dots / Icons -->
  <g transform="translate(680, 50)" opacity="0.8">
    <rect x="0" y="0" width="120" height="75" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1" />
    <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">STATUS</text>
    <text x="18" y="52" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">🚀 Open to Work</text>
  </g>
</svg>
