      .bg { fill: #0d1117; rx: 8px; }
      .cell { width: 10px; height: 10px; rx: 2px; ry: 2px; }
      .c0 { fill: #161b22; }
      .c1 { fill: #0e4429; }
      .c2 { fill: #006d32; }
      .c3 { fill: #26a641; }
      .c4 { fill: #39d353; }
      
      @keyframes snakeTravel {
        0% { transform: translate(0, 0); }
        15% { transform: translate(180px, 45px); }
        30% { transform: translate(360px, 15px); }
        50% { transform: translate(540px, 60px); }
        70% { transform: translate(680px, 30px); }
        85% { transform: translate(780px, 75px); }
        100% { transform: translate(0, 0); }
      }
      
      @keyframes dotBlink {
        0%, 100% { fill: #39d353; }
        50% { fill: #ff6e40; }
      }
    </style>
  </defs>

