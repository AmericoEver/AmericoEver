      @keyframes eatFood1 {
        0%, 100% { transform: scale(1); fill: #ff6e40; opacity: 1; }
        50% { transform: scale(1.4); fill: #fbbf24; opacity: 0.9; }
      }
      @keyframes eatFood2 {
        0%, 100% { transform: scale(1); fill: #10b981; opacity: 1; }
        50% { transform: scale(1.3); fill: #38bdf8; opacity: 0.8; }
      }
    </style>
