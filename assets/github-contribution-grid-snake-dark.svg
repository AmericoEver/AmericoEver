  <defs>
    <linearGradient id="snkHeadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="snkBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <style>
      .bg { fill: #0b0f17; rx: 10px; stroke: #1e293b; stroke-width: 1.5px; }
      .cell { width: 10px; height: 10px; rx: 2.5px; ry: 2.5px; }
      .c0 { fill: #161e2e; }
      .c1 { fill: #064e3b; }
      .c2 { fill: #047857; }
      .c3 { fill: #10b981; }
      .c4 { fill: #34d399; }
      
      @keyframes slither {
        0%   { transform: translate(0px, 0px); }
        10%  { transform: translate(145px, 29px); }
        25%  { transform: translate(290px, 58px); }
        40%  { transform: translate(435px, 14.5px); }
        55%  { transform: translate(580px, 43.5px); }
        70%  { transform: translate(667px, 72.5px); }
        85%  { transform: translate(754px, 29px); }
        100% { transform: translate(0px, 0px); }
      }
      
      @keyframes eatFood {
        0%, 100% { transform: scale(1); fill: #ff6e40; }
        50% { transform: scale(1.35); fill: #fbbf24; }
      }
      
      @keyframes tongueFlick {
        0%, 100% { transform: scaleX(0.5); opacity: 0; }
        50% { transform: scaleX(1.4); opacity: 1; }
      }
    </style>
  </defs>

